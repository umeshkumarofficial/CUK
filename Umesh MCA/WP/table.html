<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
    <style>
        table {
            width: 40%;
            border-collapse: collapse;
            margin: 20px auto;
            
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Student Information</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>Umesh</td>
            <td>21</td>
            <td>MCA</td>
        </tr>
        <tr>
            <td>Yash</td>
            <td>21</td>
            <td>MCA</td>
        </tr>
        <tr>
            <td>Abhi</td>
            <td>20</td>
            <td>MBA</td>
        </tr>
    </table>

</body>
</html>
